<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>一周家庭训练计划</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#2563eb;
      --primary-soft:#eaf1ff;
      --warm:#fff7ed;
      --warm-text:#9a3412;
      --main:#eff6ff;
      --main-text:#1d4ed8;
      --stretch:#f0fdf4;
      --stretch-text:#166534;
      --shadow:0 8px 30px rgba(31,41,55,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    .app{
      max-width:760px;
      margin:0 auto;
      padding:18px 14px calc(40px + env(safe-area-inset-bottom));
    }
    .hero{
      background:linear-gradient(135deg,#1d4ed8,#3b82f6);
      color:#fff;
      padding:20px 18px;
      border-radius:20px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }
    .hero h1{
      font-size:24px;
      margin:0 0 8px;
      letter-spacing:.2px;
    }
    .hero p{
      margin:0;
      opacity:.92;
      line-height:1.65;
      font-size:14px;
    }
    .day-tabs{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-bottom:14px;
    }
    .day-btn{
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      padding:11px 6px;
      border-radius:12px;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .day-btn.active{
      background:var(--primary);
      border-color:var(--primary);
      color:#fff;
      box-shadow:0 4px 12px rgba(37,99,235,.22);
    }
    .summary{
      background:var(--card);
      border-radius:16px;
      padding:16px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .summary h2{
      margin:0 0 8px;
      font-size:20px;
    }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:#f3f4f6;
      color:#374151;
      font-size:13px;
      font-weight:600;
    }
    .note{
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }
    .section{
      background:var(--card);
      border-radius:16px;
      margin-bottom:14px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      font-weight:800;
      border-bottom:1px solid var(--line);
    }
    .section-head .time{
      font-size:13px;
      font-weight:700;
      color:var(--muted);
    }
    .warmup .section-head{background:var(--warm);color:var(--warm-text)}
    .mainwork .section-head{background:var(--main);color:var(--main-text)}
    .stretch .section-head{background:var(--stretch);color:var(--stretch-text)}
    .item{
      display:grid;
      grid-template-columns:42px 1fr auto;
      gap:10px;
      align-items:start;
      padding:13px 16px;
      border-bottom:1px solid var(--line);
    }
    .item:last-child{border-bottom:none}
    .num{
      width:30px;
      height:30px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f3f4f6;
      font-weight:800;
      font-size:13px;
    }
    .item-title{
      font-weight:800;
      font-size:15px;
      line-height:1.4;
    }
    .item-desc{
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .duration{
      white-space:nowrap;
      font-size:13px;
      font-weight:800;
      color:#111827;
      background:#f9fafb;
      padding:5px 8px;
      border-radius:8px;
    }
    .exercise-link{
      display:inline-block;
      margin-top:6px;
      color:var(--primary);
      font-size:13px;
      text-decoration:none;
      font-weight:700;
    }
    .footer{
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
      padding:4px 4px 0;
    }
    @media(max-width:460px){
      .day-tabs{grid-template-columns:repeat(4,1fr)}
      .hero h1{font-size:21px}
      .item{grid-template-columns:36px 1fr}
      .duration{grid-column:2;justify-self:start}
    }
  
    .controls{
      background:var(--card);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .controls-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .btn{
      border:none;
      border-radius:12px;
      padding:10px 14px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-primary{background:var(--primary);color:#fff}
    .btn-secondary{background:#eef2f7;color:#1f2937}
    .btn-success{background:#16a34a;color:#fff}
    .btn-danger{background:#fee2e2;color:#991b1b}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .timer-panel{
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      background:#fafafa;
    }
    .timer-label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .timer-exercise{
      margin-top:4px;
      font-size:20px;
      font-weight:900;
      line-height:1.35;
    }
    .timer-count{
      font-variant-numeric:tabular-nums;
      font-size:44px;
      font-weight:900;
      letter-spacing:1px;
      margin:8px 0 4px;
    }
    .timer-sub{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }
    .progress-wrap{
      margin-top:10px;
      height:8px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
    }
    .progress-bar{
      height:100%;
      width:0%;
      background:var(--primary);
      transition:width .25s linear;
    }
    .history{
      background:var(--card);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .history-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    .history-title{
      font-size:16px;
      font-weight:900;
    }
    .history-stats{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .record-list{
      margin-top:12px;
      display:grid;
      gap:8px;
    }
    .record{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      padding:10px 12px;
      border-radius:10px;
      background:#f9fafb;
      font-size:13px;
    }
    .done-badge{
      color:#166534;
      background:#dcfce7;
      padding:4px 8px;
      border-radius:999px;
      font-weight:800;
      white-space:nowrap;
    }

  
    .family-card{
      background:var(--card);
      border-radius:16px;
      padding:14px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
    }
    .family-title{
      font-size:13px;
      color:var(--muted);
      font-weight:800;
      margin-bottom:9px;
    }
    .family-tabs{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .family-btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:12px 8px;
      font-size:15px;
      font-weight:900;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .family-btn.active{
      background:#111827;
      border-color:#111827;
      color:#fff;
    }
    .voice-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--line);
    }
    .voice-copy{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }
    .placeholder{
      background:var(--card);
      border-radius:16px;
      padding:22px 16px;
      box-shadow:var(--shadow);
      margin-bottom:14px;
      text-align:center;
    }
    .placeholder h3{margin:0 0 8px;font-size:18px}
    .placeholder p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}

</style>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家庭健身">

</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>一周家庭训练计划</h1>
      <p>每天约 20–30 分钟｜核心稳定 + 全身抗阻｜低冲击、腰部友好</p>
    </section>


    <section class="family-card">
      <div class="family-title">选择家庭成员</div>
      <div class="family-tabs" id="familyTabs">
        <button class="family-btn active" data-member="mom">妈妈</button>
        <button class="family-btn" data-member="dad">爸爸</button>
        <button class="family-btn" data-member="daughter">女儿</button>
      </div>
      <div class="voice-row">
        <div class="voice-copy">语音提醒：动作开始、节奏、换边/换方向和休息提醒</div>
        <button class="btn btn-secondary" id="voiceBtn">语音提醒：开</button>
      </div>
    </section>

    <div class="day-tabs" id="dayTabs"></div>

    <section class="summary">
      <h2 id="dayTitle"></h2>
      <div id="dayFocus"></div>
      <div class="meta">
        <span class="pill" id="totalTime"></span>
        <span class="pill">强度 RPE 5–7/10</span>
        <span class="pill">动作慢、稳、不过度追求次数</span>
      </div>
      <div class="note" id="dayNote"></div>
    </section>

    <section class="controls">
      <div class="controls-row">
        <button class="btn btn-primary" id="startBtn">开始今日训练</button>
        <button class="btn btn-secondary" id="pauseBtn" disabled>暂停</button>
        <button class="btn btn-secondary" id="prevBtn" disabled>上一项</button>
        <button class="btn btn-secondary" id="nextBtn" disabled>下一项</button>
        <button class="btn btn-success" id="completeBtn">标记今日完成</button>
      </div>
      <div class="timer-panel" id="timerPanel">
        <div class="timer-label" id="timerPhase">未开始</div>
        <div class="timer-exercise" id="timerExercise">点击“开始今日训练”进入自动倒计时</div>
        <div class="timer-count" id="timerCount">00:00</div>
        <div class="timer-sub" id="timerSub">会按动作和休息顺序自动切换。</div>
        <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </section>

    <section class="history">
      <div class="history-top">
        <div class="history-title">完成记录</div>
        <button class="btn btn-danger" id="clearHistoryBtn">清空记录</button>
      </div>
      <div class="history-stats">
        <span class="pill" id="weekDone">本周完成 0 天</span>
        <span class="pill" id="totalDone">累计完成 0 次</span>
      </div>
      <div class="record-list" id="recordList"></div>
    </section>

    <div id="plan"></div>

    <div class="footer">
      提示：如果出现腰部锐痛、明显刺痛、腿部放射痛或麻木，请停止对应动作。普通肌肉酸胀与训练后的轻度疲劳通常可以接受。
    </div>
  </main>

<script>
const momPlans = {

        ["臀桥","不要顶腰","40秒 + 休20秒"],

      ]},
      {type:"stretch", name:"拉伸", time:"4 分钟", items:[

      ]}
    ]
  },
  "周五": {
    title:"周五｜核心 + 臀部稳定",
    focus:"重点：核心稳定、臀中肌、抗旋转",
    total:"约 24 分钟",
    note:"核心训练不是追求腰腹酸痛，而是让躯干在动作中保持稳定。",
    sections:[

function unlockAudio(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
    if(sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain); gain.connect(sharedAudioCtx.destination);
    osc.start(); osc.stop(sharedAudioCtx.currentTime + 0.02);
  }catch(e){}
}

function chooseChineseVoice(){
  try{
    const voices = speechSynthesis.getVoices();
    return voices.find(v => /^zh/i.test(v.lang) && /Ting|Mei|Yu|Chinese|中文|普通话/i.test(v.name))
      || voices.find(v => /^zh/i.test(v.lang))
      || null;
  }catch(e){ return null; }
}

function speak(text, interrupt=true){
  if(!voiceEnabled || !text || !("speechSynthesis" in window)) return;
  try{
    if(interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 1.08;
    u.pitch = 1.0;
    const v = chooseChineseVoice();
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function parseDuration(text){
  if(!text) return 40;
  let m = text.match(/(\d+)\s*分钟/);
  if(m) return parseInt(m[1],10)*60;
  m = text.match(/(\d+)\s*秒/);
  if(m) return parseInt(m[1],10);
  return 40;
}

function parseRest(text){
  if(!text) return 0;
  let m = text.match(/休\s*(\d+)\s*秒/);
  if(m) return parseInt(m[1],10);
  m = text.match(/换边\s*(\d+)\s*秒/);
  if(m) return parseInt(m[1],10);
  m = text.match(/换动作\s*(\d+)\s*秒/);
  if(m) return parseInt(m[1],10);
  return 0;
}

function buildTimerSteps(day){
  if(currentMember === "daughter") return daughterTimerSteps();
  const p = getPlan(day);
  if(!p) return [];
  const steps = [];
  p.sections.forEach(section=>{
    const roundsMatch = section.name.match(/(\d+)\s*轮/);
    const rounds = roundsMatch ? parseInt(roundsMatch[1],10) : 1;
    for(let r=1;r<=rounds;r++){
      section.items.forEach(it=>{
        const dur = parseDuration(it[2]);
        const dadCue = currentMember === "dad" && section.type === "mainwork"
          ? {20:"保持正常呼吸。发力时呼气，不要憋气。"}
          : null;
        steps.push({
          type:"exercise",
          name:it[0],
          detail:it[1],
          duration:dur,
          section:section.name,
          round:rounds>1 ? `第 ${r}/${rounds} 轮` : "",
          voiceStart:`开始${it[0]}。${it[1]}`,
          cues:dadCue
        });
        const rest = parseRest(it[2]);
        if(rest>0){
          steps.push({
            type:"rest",
            name:"休息 / 换动作",
            detail:"准备下一项，放松呼吸",
            duration:rest,
            section:section.name,
            round:rounds>1 ? `第 ${r}/${rounds} 轮` : "",
            voiceStart:`休息${rest}秒。放松呼吸。`
          });
        }
      });
    }
  });
  return steps;
}

function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function resetTimerPanel(){
  timerSteps = buildTimerSteps(currentDay);
  currentStep = 0;
  remaining = 0;
  stepDuration = 0;
  lastVoiceCueSecond = -1;
  document.getElementById("timerPhase").textContent = "未开始";
  document.getElementById("timerExercise").textContent =
    timerSteps.length ? "点击“开始今日训练”进入自动倒计时" : "当前家庭成员尚无训练计划";
  document.getElementById("timerCount").textContent = "00:00";
  document.getElementById("timerSub").textContent =
    timerSteps.length ? `共 ${timerSteps.length} 个计时步骤，会自动切换。` : "请选择已有训练计划的家庭成员。";
  document.getElementById("progressBar").style.width = "0%";
  document.getElementById("startBtn").disabled = !timerSteps.length;
  document.getElementById("completeBtn").disabled = !timerSteps.length;
  document.getElementById("pauseBtn").disabled = true;
  document.getElementById("prevBtn").disabled = true;
  document.getElementById("nextBtn").disabled = true;
  document.getElementById("pauseBtn").textContent = "暂停";
}

function startWorkout(){
  unlockAudio();
  timerSteps = buildTimerSteps(currentDay);
  if(!timerSteps.length) return;
  currentStep = 0;
  loadStep(true);
  document.getElementById("startBtn").disabled = true;
  document.getElementById("pauseBtn").disabled = false;
  document.getElementById("prevBtn").disabled = false;
  document.getElementById("nextBtn").disabled = false;
  startTicking();
}

function loadStep(withVoice=true){
  const st = timerSteps[currentStep];
  if(!st){
    finishWorkout();
    return;
  }
  remaining = st.duration;
  stepDuration = st.duration;
  isPaused = false;
  lastVoiceCueSecond = -1;
  updateTimerUI();
  if(withVoice) speak(st.voiceStart || `${st.name}，开始。`);
}

function updateTimerUI(){
  const st = timerSteps[currentStep];
  if(!st) return;
  document.getElementById("timerPhase").textContent =
    `${st.type==="rest" ? "休息" : "训练"} · ${st.section}${st.round ? " · "+st.round : ""}`;
  document.getElementById("timerExercise").textContent = st.name;
  document.getElementById("timerCount").textContent = fmt(remaining);
  document.getElementById("timerSub").textContent =
    `${st.detail || ""}　步骤 ${currentStep+1}/${timerSteps.length}`;
  const pct = stepDuration ? ((stepDuration-remaining)/stepDuration)*100 : 0;
  document.getElementById("progressBar").style.width = `${Math.min(100,Math.max(0,pct))}%`;
}

function fireTimedVoiceCue(){
  if(!voiceEnabled) return;
  const st = timerSteps[currentStep];
  if(!st || !st.cues) return;
  const elapsed = stepDuration - remaining;
  if(elapsed === lastVoiceCueSecond) return;
  const cue = st.cues[elapsed];
  if(cue){
    lastVoiceCueSecond = elapsed;
    speak(cue);
  }
}

function startTicking(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    if(isPaused) return;
    remaining -= 1;
    if(remaining <= 0){
      remaining = 0;
      updateTimerUI();
      beep();
      currentStep += 1;
      if(currentStep >= timerSteps.length){
        finishWorkout();
        return;
      }
      loadStep(true);
    }else{
      updateTimerUI();
      fireTimedVoiceCue();
    }
  },1000);
}

function stopTimer(){
  clearInterval(timerId);
  timerId = null;
  isPaused = false;
  try { speechSynthesis.cancel(); } catch(e){}
}

function togglePause(){
  if(!timerId) return;
  isPaused = !isPaused;
  document.getElementById("pauseBtn").textContent = isPaused ? "继续" : "暂停";
  if(isPaused){
    try { speechSynthesis.cancel(); } catch(e){}
    document.getElementById("timerPhase").textContent = "已暂停";
  }else{
    updateTimerUI();
    speak("继续训练。");
  }
}

function prevStep(){
  if(!timerSteps.length) return;
  currentStep = Math.max(0,currentStep-1);
  loadStep(true);
}

function nextStep(){
  if(!timerSteps.length) return;
  currentStep += 1;
  if(currentStep >= timerSteps.length) finishWorkout();
  else loadStep(true);
}

function finishWorkout(){
  stopTimer();
  document.getElementById("timerPhase").textContent = "训练完成";
  document.getElementById("timerExercise").textContent = `${memberNames[currentMember]}今天的训练完成了`;
  document.getElementById("timerCount").textContent = "✓";
  document.getElementById("timerSub").textContent = "已自动记录本次完成。";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("startBtn").disabled = false;
  document.getElementById("pauseBtn").disabled = true;
  document.getElementById("prevBtn").disabled = true;
  document.getElementById("nextBtn").disabled = true;
  speak("今天的训练完成了。做得很好，放松一下。");
  markComplete(true);
}

function beep(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    if(!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
    if(sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
    const osc = sharedAudioCtx.createOscillator();
    const gain = sharedAudioCtx.createGain();
    osc.connect(gain); gain.connect(sharedAudioCtx.destination);
    osc.frequency.value = 880;
    gain.gain.value = 0.05;
    osc.start();
    osc.stop(sharedAudioCtx.currentTime + 0.12);
  }catch(e){}
}

function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function getRecords(){
  try{
    const rs = JSON.parse(localStorage.getItem("fitness_completion_records") || "[]");
    return rs.map(r => ({...r, member:r.member || "mom"}));
  }catch(e){ return []; }
}

function saveRecords(records){
  try{
    localStorage.setItem("fitness_completion_records", JSON.stringify(records));
  }catch(e){}
}

function markComplete(auto=false){
  if(!getPlan(currentDay)) return;
  const records = getRecords();
  const date = todayKey();
  const exists = records.some(r=>r.date===date && r.day===currentDay && r.member===currentMember);
  if(!exists){
    records.push({
      date,
      day:currentDay,
      member:currentMember,
      title:getPlan(currentDay).title
    });
    saveRecords(records);
  }
  renderHistory();
  if(!auto){
    document.getElementById("timerSub").textContent = `已记录${memberNames[currentMember]}今天完成训练。`;
  }
}

function startOfWeek(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}

function renderHistory(){
  const records = getRecords()
    .filter(r=>r.member===currentMember)
    .sort((a,b)=>b.date.localeCompare(a.date));
  const now = new Date();
  const ws = startOfWeek(now);
  const we = new Date(ws); we.setDate(ws.getDate()+7);
  const weekDates = new Set(records.filter(r=>{
    const d = new Date(r.date+"T00:00:00");
    return d>=ws && d<we;
  }).map(r=>r.date));

  document.querySelector(".history-title").textContent = `${memberNames[currentMember]}的完成记录`;
  document.getElementById("weekDone").textContent = `本周完成 ${weekDates.size} 天`;
  document.getElementById("totalDone").textContent = `累计完成 ${records.length} 次`;

  const list = document.getElementById("recordList");
  if(!records.length){
    list.innerHTML = `<div class="note">还没有完成记录。完成训练后会自动保存在当前设备。</div>`;
    return;
  }
  list.innerHTML = records.slice(0,10).map(r=>`
    <div class="record">
      <div><strong>${r.date}</strong>　${r.day}</div>
      <span class="done-badge">已完成</span>
    </div>
  `).join("");
}

function clearHistory(){
  if(!confirm(`确定清空${memberNames[currentMember]}的本地完成记录吗？`)) return;
  const records = getRecords().filter(r=>r.member!==currentMember);
  saveRecords(records);
  renderHistory();
}

document.querySelectorAll(".family-btn").forEach(btn=>{
  btn.addEventListener("click",()=>selectMember(btn.dataset.member));
});
document.getElementById("voiceBtn").addEventListener("click",()=>{
  voiceEnabled = !voiceEnabled;
  try { localStorage.setItem("fitness_voice_enabled", voiceEnabled ? "1" : "0"); } catch(e){}
  if(!voiceEnabled){ try { speechSynthesis.cancel(); } catch(e){} }
  renderFamilyTabs();
  if(voiceEnabled) speak("语音提醒已开启。");
});
document.getElementById("startBtn").addEventListener("click", startWorkout);
document.getElementById("pauseBtn").addEventListener("click", togglePause);
document.getElementById("prevBtn").addEventListener("click", prevStep);
document.getElementById("nextBtn").addEventListener("click", nextStep);
document.getElementById("completeBtn").addEventListener("click", ()=>markComplete(false));
document.getElementById("clearHistoryBtn").addEventListener("click", clearHistory);

let initial = "周一";
try {
  const savedMember = localStorage.getItem("fitness_selected_member");
  if(["mom","dad","daughter"].includes(savedMember)) currentMember = savedMember;
  const voiceSaved = localStorage.getItem("fitness_voice_enabled");
  if(voiceSaved !== null) voiceEnabled = voiceSaved === "1";
  const saved = localStorage.getItem("fitness_selected_day");
  if(order.includes(saved)) initial = saved;
  else{
    const jsDay = new Date().getDay();
    const map = {1:"周一",2:"周二",3:"周三",4:"周四",5:"周五",6:"周六",0:"周日"};
    initial = map[jsDay] || "周一";
  }
} catch(e){}

renderFamilyTabs();
render(initial);
</script>
