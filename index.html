<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家庭健身">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>家庭健身</title>
  <style>
    :root{
      --bg:#f7f8fa; --card:#fff; --text:#172033; --muted:#697386; --line:#e6e9ef;
      --primary:#315efb; --primary-soft:#eef2ff; --success:#138a55; --success-soft:#eaf8f1;
      --warning:#9a6700; --warning-soft:#fff6d8; --danger:#b42318; --radius:18px;
      --shadow:0 8px 24px rgba(23,32,51,.07); --dock-h:88px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    button,a{font:inherit}
    button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;padding:0 14px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom))}
    .top{position:sticky;top:0;z-index:20;background:rgba(247,248,250,.94);backdrop-filter:blur(16px);padding:10px 0 10px;border-bottom:1px solid rgba(230,233,239,.85)}
    .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{font-size:20px;font-weight:900;letter-spacing:-.3px}
    .wake{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#eef1f5;color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}
    .wake.on{background:var(--success-soft);color:var(--success)} .wake.warn{background:var(--warning-soft);color:var(--warning)}
    .member-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
    .member-btn,.day-btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;min-height:40px;font-weight:800}
    .member-btn.active,.day-btn.active{background:var(--text);border-color:var(--text);color:#fff}
    .days{display:flex;gap:7px;overflow:auto;padding:9px 0 1px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
    .day-btn{min-width:56px;padding:0 9px}
    .session-card{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .session-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
    .session-title{font-size:20px;font-weight:900;line-height:1.35;margin-top:4px}
    .session-focus{font-size:13px;color:var(--muted);line-height:1.6;margin-top:5px}
    .session-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
    .stat{background:#f7f8fa;border-radius:12px;padding:10px 9px}.stat strong{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted);font-weight:700}
    .progress-meta{display:flex;justify-content:space-between;align-items:center;margin-top:13px;font-size:12px;color:var(--muted);font-weight:800}
    .progress{height:8px;background:#e9edf3;border-radius:999px;overflow:hidden;margin-top:6px}.progress>div{height:100%;width:0;background:var(--primary);transition:width .25s ease}
    .note{margin-top:12px;padding:10px 12px;background:#fafbfc;border-radius:12px;color:var(--muted);font-size:12px;line-height:1.6}
    .section{margin:18px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin:0 3px 8px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
    .exercise{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0;transition:.2s ease;scroll-margin-top:170px;scroll-margin-bottom:120px}
    .exercise.current{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,94,251,.09),var(--shadow)}
    .exercise.current:before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:4px;background:var(--primary);border-radius:0 6px 6px 0}
    .exercise.done{background:#fbfcfb;border-color:#d8eee2}.exercise.done .step-num{background:var(--success);color:#fff}
    .exercise-grid{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start}
    .step-num{width:31px;height:31px;border-radius:10px;background:#f0f2f6;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
    .ex-title{font-size:15px;font-weight:900;line-height:1.35}.ex-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}
    .ex-plan{display:inline-flex;margin-top:8px;padding:5px 8px;border-radius:8px;background:#f4f6f8;font-size:11px;font-weight:800;color:#4d586a}
    .ex-time{margin-top:6px;font-size:12px;font-weight:800;color:var(--primary)}
    .ex-actions{display:flex;gap:7px}.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text)}
    .detail-link{display:inline-flex;align-items:center;gap:5px;margin-top:9px;color:var(--primary);text-decoration:none;font-size:12px;font-weight:850}

    .inline-guide{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fafbfc;overflow:hidden}
    .inline-guide>summary{list-style:none;min-height:42px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-size:12px;font-weight:900;color:#3d485a;-webkit-tap-highlight-color:transparent}
    .inline-guide>summary::-webkit-details-marker{display:none}
    .inline-guide>summary:after{content:"⌄";font-size:17px;line-height:1;color:var(--muted);transition:transform .18s ease}
    .inline-guide[open]>summary:after{transform:rotate(180deg)}
    .inline-guide[open]>summary{border-bottom:1px solid var(--line);background:#fff}
    .inline-guide-body{display:grid;gap:8px;padding:10px}
    .inline-guide-item{background:#fff;border:1px solid #edf0f4;border-radius:10px;padding:9px 10px}
    .inline-guide-item strong{display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:4px;color:#293348}
    .inline-guide-item p{margin:0;font-size:12px;line-height:1.58;color:var(--muted)}
    .inline-guide-item.error strong{color:#9b2c24}
    .inline-guide-item.breathe strong{color:#166534}
    .inline-guide-item.beginner strong{color:#6842a5}

    .empty{padding:28px 16px;text-align:center;color:var(--muted)}
    .history{margin:20px 0 8px}.history summary{font-weight:900;cursor:pointer}.record{margin-top:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px}.record-top{display:flex;justify-content:space-between;gap:10px}.record-items{margin-top:8px;color:var(--muted);line-height:1.65}
    .dock{position:fixed;z-index:50;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right))}
    .dock-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    .dock button{min-height:58px;border:0;border-radius:13px;background:#f2f4f7;color:#293348;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:850}
    .dock button .ico{font-size:19px;line-height:1}.dock button.primary{background:var(--primary);color:#fff}.dock button.success{background:var(--success-soft);color:var(--success)}.dock button:disabled{opacity:.38}
    .dock button.skip-rest{background:#fff3df;color:#a05b00}
    .dock button[hidden]{display:none!important}
    .dock-inner.resting{grid-template-columns:repeat(6,1fr)}
    .rest-banner{display:none;margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#fff5e6;color:#8a5200;font-size:12px;font-weight:850;text-align:center}
    .rest-banner.show{display:block}
    .set-status{display:none;margin-top:7px;font-size:11px;font-weight:900;color:var(--primary)}
    .set-status.show{display:block}

    .toast{position:fixed;z-index:80;left:50%;bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);max-width:88%;background:#172033;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .detail-view{display:none;padding-top:12px}.detail-view.show{display:block}.home-view.hide{display:none}
    .back{border:0;background:#eef1f5;border-radius:11px;padding:10px 12px;font-weight:850;color:var(--text)}
    .detail-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
    .detail-visual{height:170px;border-radius:16px;background:linear-gradient(145deg,#f1f4f9,#e8edff);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .figure{width:120px;height:120px;position:relative}.figure .head{position:absolute;width:28px;height:28px;border:6px solid #35415a;border-radius:50%;left:46px;top:6px}.figure .body{position:absolute;width:8px;height:58px;background:#35415a;border-radius:8px;left:56px;top:36px}.figure .arm{position:absolute;width:64px;height:7px;background:#35415a;border-radius:8px;left:28px;top:50px}.figure .leg1,.figure .leg2{position:absolute;width:7px;height:47px;background:#35415a;border-radius:8px;top:88px;transform-origin:top}.figure .leg1{left:56px;transform:rotate(23deg)}.figure .leg2{left:58px;transform:rotate(-23deg)}
    .detail-title{font-size:24px;font-weight:950;margin:16px 0 4px}.detail-sub{color:var(--muted);font-size:13px;line-height:1.6}
    .guide{margin-top:14px;display:grid;gap:10px}.guide-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.guide-card h3{font-size:13px;margin:0 0 6px}.guide-card p{font-size:13px;line-height:1.7;color:#4d586a;margin:0}
    .media-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.media-row a,.speak-detail{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;text-decoration:none;font-weight:900;font-size:13px}.media-row a{background:#eef2ff;color:var(--primary)}.speak-detail{width:100%;margin-top:8px;border:0;background:#172033;color:white}
    @media(max-width:420px){.session-title{font-size:18px}.session-stats{grid-template-columns:1fr 1fr 1fr}.exercise-grid{grid-template-columns:34px 1fr auto}.ex-actions{flex-direction:column}.dock button{min-height:56px}.brand{font-size:18px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="top-row"><div class="brand">家庭健身</div><div id="wakeBadge" class="wake">☀️ 开始后保持常亮</div></div>
      <div id="memberTabs" class="member-tabs">
        <button class="member-btn active" data-member="mom">妈妈</button>
        <button class="member-btn" data-member="dad">爸爸</button>
        <button class="member-btn" data-member="daughter">女儿</button>
      </div>
      <div id="dayTabs" class="days"></div>
    </div>

    <main id="homeView" class="home-view">
      <section class="session-card">
        <div class="session-label">今日训练</div>
        <div id="sessionTitle" class="session-title"></div>
        <div id="sessionFocus" class="session-focus"></div>
        <div class="session-stats">
          <div class="stat"><strong id="sessionElapsed">00:00</strong><span>本次总时长</span></div>
          <div class="stat"><strong id="currentElapsed">00:00</strong><span id="currentTimerLabel">当前动作</span></div>
          <div class="stat"><strong id="progressCount">0/0</strong><span>完成进度</span></div>
        </div>
        <div class="progress-meta"><span>训练进度</span><span id="progressPct">0%</span></div>
        <div class="progress"><div id="progressBar"></div></div><div id="restBanner" class="rest-banner" aria-live="polite"></div>
        <div id="sessionNote" class="note"></div>
      </section>
      <div id="planList"></div>
      <details class="history"><summary id="historyTitle">完成记录</summary><div id="historyList"></div></details>
    </main>

    <main id="detailView" class="detail-view">
      <button id="backBtn" class="back">← 返回训练</button>
      <section class="detail-hero">
        <div class="detail-visual" aria-label="动作示意图"><div class="figure" aria-hidden="true"><span class="head"></span><span class="body"></span><span class="arm"></span><span class="leg1"></span><span class="leg2"></span></div></div>
        <div id="detailTitle" class="detail-title"></div>
        <div id="detailPlan" class="detail-sub"></div>
        <button id="detailSpeak" class="speak-detail">🔊 收听动作要领</button>
        <div class="guide">
          <div class="guide-card"><h3>动作要点</h3><p id="detailPoints"></p></div>
          <div class="guide-card"><h3>常见错误</h3><p id="detailErrors"></p></div>
          <div class="guide-card"><h3>呼吸节奏</h3><p id="detailBreathing"></p></div>
          <div class="guide-card"><h3>初学者替代</h3><p id="detailBeginner"></p></div>
        </div>
        <div class="media-row"><a id="imageDemo" target="_blank" rel="noopener">🖼 图片演示</a><a id="videoDemo" target="_blank" rel="noopener">▶️ 视频演示</a></div>
      </section>
    </main>
  </div>

  <nav class="dock" aria-label="训练控制">
    <div class="dock-inner">
      <button id="startBtn" class="primary"><span class="ico">▶️</span><span>开始锻炼</span></button>
      <button id="pauseBtn" disabled><span class="ico">⏸</span><span>暂停</span></button>
      <button id="prevBtn" disabled><span class="ico">←</span><span>前一项</span></button>
      <button id="nextBtn" disabled><span class="ico">→</span><span>后一项</span></button>
      <button id="completeBtn" class="success" disabled><span class="ico">✓</span><span>标记完成</span></button>
      <button id="skipRestBtn" class="skip-rest" hidden><span class="ico">⏭</span><span>略过休息</span></button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const momPlans = {
  "周一":{
    title:"妈妈｜周一下肢 + 核心",
    focus:"约30–35分钟｜臀腿力量 + 核心稳定",
    total:"约 30–35 分钟",
    note:"第1–2周按页面默认2组执行；动作稳定后，第3周起可把杯式深蹲、罗马尼亚硬拉逐步增加到3组。重量以做完仍能再完成约3–4次为宜。",
    sections:[
      {type:"warmup",name:"热身｜约6分钟",time:"约6分钟",items:[
        ["原地快走","身体直立、脚步轻，逐渐加快","2分钟"],
        ["肩绕环","肩膀向后、向下缓慢绕环","60秒"],
        ["髋关节绕环","骨盆小幅绕圈，上身尽量稳定","60秒"],
        ["徒手髋铰链","膝微屈，臀部向后推，背部自然","60秒"],
        ["徒手浅蹲","屁股向后坐，膝盖朝脚尖方向","60秒"]
      ]},
      {type:"mainwork",name:"主训练",time:"约20分钟",items:[
        ["哑铃杯式深蹲","8–12次/组 × 2组。哑铃贴近胸前，脚掌踩稳；下蹲吸气，站起呼气","8–12次/组 × 2组 · 每组45秒 · 组间休60秒"],
        ["哑铃罗马尼亚硬拉","8–12次/组 × 2组。哑铃贴近腿，臀部向后；大腿后侧有拉伸即可","8–12次/组 × 2组 · 每组45秒 · 组间休60秒"],
        ["臀桥","12–15次/组 × 2组。夹臀抬髋，不用腰向上顶","12–15次/组 × 2组 · 每组45秒 · 组间休45秒"],
        ["扶椅反向箭步蹲","左右各8–10次/组 × 2组。扶椅保持平衡，前腿承担主要重量","左右各8–10次/组 × 2组 · 每组60秒 · 组间休60秒"],
        ["Pallof Press","左右各8–12次/组 × 2组。胸口和骨盆朝前，推出时呼气","左右各8–12次/组 × 2组 · 每组60秒 · 组间休45秒"],
        ["Dead Bug 死虫式","左右各6–8次/组 × 2组。腰腹稳定，手脚伸展时呼气","左右各6–8次/组 × 2组 · 每组60秒 · 组间休45秒"]
      ]},
      {type:"stretch",name:"练后拉伸｜约4分钟",time:"约4分钟",items:[
        ["髋屈肌左","夹臀后再轻轻向前，不要拱腰","40秒"],
        ["髋屈肌右","保持骨盆稳定，拉到舒适牵拉感","40秒"],
        ["臀肌拉伸","4字腿轻柔拉伸，腰部保持稳定","40秒"],
        ["大腿后侧拉伸","膝可微弯，不要猛烈压腿","40秒"],
        ["小腿拉伸","后脚跟踩地、脚尖朝前","40秒"]
      ]}
    ]
  },
  "周二":{
    title:"妈妈｜周二有氧 + 活动度",
    focus:"约28–32分钟｜中低强度有氧 + 脊柱活动",
    total:"约 30 分钟",
    note:"快走强度以可以说话、但不能轻松连续唱歌为宜。前2周不要求跳绳。",
    sections:[
      {type:"warmup",name:"有氧",time:"20分钟",items:[
        ["原地快走 / 户外快走","保持稳定步频，脚步轻，手臂自然摆动","20分钟"]
      ]},
      {type:"mainwork",name:"活动度 + 轻核心",time:"约8–10分钟",items:[
        ["猫牛式","12次/组 × 2组。动作随呼吸缓慢完成","12次/组 × 2组 · 每组45秒 · 组间休30秒"],
        ["胸椎旋转","左右各8次/组 × 2组。骨盆尽量稳定，从上胸部旋转","左右各8次/组 × 2组 · 每组50秒 · 组间休30秒"],
        ["弹力带拉开","12次/组 × 2组。肩膀下沉，肩胛骨向后靠拢","12次/组 × 2组 · 每组45秒 · 组间休30秒"],
        ["Bird Dog 鸟狗式","左右各6次/组 × 2组。骨盆保持水平","左右各6次/组 × 2组 · 每组50秒 · 组间休30秒"]
      ]},
      {type:"stretch",name:"结束拉伸",time:"约2分钟",items:[
        ["髋屈肌左","轻柔拉伸，不拱腰","40秒"],
        ["髋屈肌右","自然慢呼吸","40秒"]
      ]}
    ]
  },
  "周三":{
    title:"妈妈｜周三上肢 + 核心",
    focus:"约30–35分钟｜胸、背、肩 + 抗旋转核心",
    total:"约 30–35 分钟",
    note:"俯卧撑从墙壁开始，太轻松后再改桌边；哑铃先轻后重，优先保证肩颈放松。",
    sections:[
      {type:"warmup",name:"热身｜约6分钟",time:"约6分钟",items:[
        ["原地走","自然摆臂，逐渐加快","2分钟"],
        ["肩绕环","向后绕环，肩颈放松","60秒"],
        ["弹力带拉开","轻阻力，肩胛骨向后靠拢","45秒"],
        ["墙壁俯卧撑","动作慢，身体保持一条直线","45秒"],
        ["Bird Dog 鸟狗式","左右交替，骨盆稳定","60秒"]
      ]},
      {type:"mainwork",name:"主训练",time:"约20分钟",items:[
        ["墙壁 / 桌边俯卧撑","8–12次/组 × 2组。靠近支撑面吸气，推开呼气","8–12次/组 × 2组 · 每组45秒 · 组间休60秒"],
        ["单臂哑铃划船","左右各8–12次/组 × 2组。肘向髋部方向拉，避免耸肩","左右各8–12次/组 × 2组 · 每组60秒 · 组间休60秒"],
        ["哑铃地板卧推","8–12次/组 × 2组。上臂触地后停，推起时呼气","8–12次/组 × 2组 · 每组45秒 · 组间休60秒"],
        ["弹力带肩外旋","10–12次/组 × 2组。双肘贴近身体，使用轻阻力","10–12次/组 × 2组 · 每组45秒 · 组间休45秒"],

function sectionSetCount(section=""){
  const m=String(section).match(/(\d+)\s*(?:轮|组)/);
  return m?Number(m[1]):1;
}
function rangeSpeak(s){
  return String(s).replace(/[–—~～-]/g,"到");
}
function exercisePrescription(x){
  const desc=String(x.desc||"");
  const plan=String(x.plan||"");
  const text=`${desc} ${plan}`;
  let sets=sectionSetCount(x.section);

  const explicitSets=text.match(/[×xX]\s*(\d+)\s*组/);
  if(explicitSets) sets=Number(explicitSets[1]);

  let m=text.match(/左右各\s*(?:约\s*)?(\d+\s*[–—~～-]\s*\d+|\d+)\s*次/);
  if(m) return `左右各${rangeSpeak(m[1]).replace(/\s+/g,"")}次，做${sets}组`;

  m=text.match(/(?:约\s*)?(\d+\s*[–—~～-]\s*\d+|\d+)\s*次\s*\/\s*组/);
  if(m) return `每组${rangeSpeak(m[1]).replace(/\s+/g,"")}次，做${sets}组`;

  m=text.match(/(?:约\s*)?(\d+\s*[–—~～-]\s*\d+|\d+)\s*次/);
  if(m) return `每组${rangeSpeak(m[1]).replace(/\s+/g,"")}次，做${sets}组`;

  m=text.match(/左\s*(\d+)\s*秒\s*\+\s*右\s*(\d+)\s*秒/);
  if(m && m[1]===m[2]) return `左右各${m[1]}秒，做${sets}组`;
  if(m) return `左侧${m[1]}秒，右侧${m[2]}秒，做${sets}组`;

  m=plan.match(/每组\s*(?:约\s*)?(\d+)\s*秒/);
  if(m) return `每组${m[1]}秒，做${sets}组`;

  m=plan.match(/(?:约\s*)?(\d+)\s*分钟/);
  if(m) return sets>1?`每组${m[1]}分钟，做${sets}组`:`持续${m[1]}分钟`;

  m=plan.match(/(?:约\s*)?(\d+)\s*秒/);
  if(m) return `每组${m[1]}秒，做${sets}组`;

  return sets>1?`按页面计划，做${sets}组`:"按页面计划完成";
}

function memberUsesCountdown(){
  return member==="mom" || member==="dad";
}
function countdownSeconds(x){
  const text=`${x?.plan||""} ${x?.desc||""}`;
  let m=text.match(/每组\s*(\d+)\s*秒/);
  if(m)return Number(m[1]);
  m=text.match(/(\d+)\s*分钟/);
  if(m)return Number(m[1])*60;
  m=text.match(/(\d+)\s*秒/);
  if(m)return Number(m[1]);
  return 45;
}
function resetCountdownForCurrent(){
  countdownRemaining=memberUsesCountdown()&&flat[currentIndex]?countdownSeconds(flat[currentIndex]):0;
  tenSecondCue=false;
}

function explicitSetCount(x){
  const text=`${x?.desc||""} ${x?.plan||""}`;
  const m=text.match(/[×xX]\s*(\d+)\s*组/);
  return m?Number(m[1]):1;
}
function groupRestSeconds(x){
  const text=`${x?.desc||""} ${x?.plan||""}`;
  const m=text.match(/组间休\s*(\d+)\s*秒/);
  return m?Number(m[1]):30;
}
function hasMoreSets(){
  return !!flat[currentIndex] && currentSet < explicitSetCount(flat[currentIndex]);
}
function currentSetText(){
  const total=flat[currentIndex]?explicitSetCount(flat[currentIndex]):1;
  return total>1?`第${currentSet}/${total}组`:"";
}

function flattenPlan(){

}

function render(){
  renderTabs();flat=flattenPlan();itemDurations=Array(flat.length).fill(0);reminderMinute=Array(flat.length).fill(0);completed=new Set();currentIndex=0;currentSet=1;inRest=false;restRemaining=0;sessionElapsed=0;started=false;paused=false;clearInterval(restTick);restTick=null;
  const p=getPlan();document.getElementById('sessionTitle').textContent=member==='daughter'?`${day}｜${p.title}`:p.title;document.getElementById('sessionFocus').textContent=p.focus;document.getElementById('sessionNote').textContent=p.note;
  let html='',last='';flat.forEach((x,i)=>{if(x.section!==last){if(last)html+='</section>';html+=`<section class="section"><div class="section-head"><h2>${esc(x.section)}</h2><span>${esc(x.sectionTime)}</span></div>`;last=x.section;}html+=exerciseCard(x,i);});if(last)html+='</section>';
  document.getElementById('planList').innerHTML=html;bindExerciseActions();updateUI();renderHistory();setControls();
}
function exerciseCard(x,i){
  const g=guideFor(x.title,x.desc);
  return `<article class="exercise" id="ex-${i}" data-index="${i}">
    <div class="exercise-grid">
      <div class="step-num">${i+1}</div>
      <div>
        <div class="ex-title">${esc(x.title)}</div>
        <div class="ex-desc">${esc(x.desc)}</div>
        <span class="ex-plan">${esc(x.plan)}</span>
        <div class="ex-time" id="time-${i}">实际用时 00:00</div>
        <div class="set-status" id="set-${i}"></div>

        <details class="inline-guide" data-guide="${i}">
          <summary>动作说明</summary>
          <div class="inline-guide-body">
            <div class="inline-guide-item">
              <strong>✓ 动作要点</strong>
              <p>${esc(g.points)}</p>
            </div>
            <div class="inline-guide-item error">
              <strong>! 常见错误</strong>
              <p>${esc(g.errors)}</p>
            </div>
            <div class="inline-guide-item breathe">
              <strong>◌ 呼吸节奏</strong>
              <p>${esc(g.breathing)}</p>
            </div>
            <div class="inline-guide-item beginner">
              <strong>↘ 初学者替代</strong>
              <p>${esc(g.beginner)}</p>
            </div>
          </div>
        </details>

        <a href="#detail-${i}" class="detail-link" data-detail="${i}">查看完整解说 · 图片 / 视频 →</a>
      </div>
      <div class="ex-actions">
        <button class="icon-btn" data-speak="${i}" aria-label="朗读${esc(x.title)}动作要领">🔊</button>
      </div>
    </div>
  </article>`;
}
function bindExerciseActions(){
  document.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',()=>speakGuide(Number(b.dataset.speak))));
  document.querySelectorAll('[data-detail]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openDetail(Number(a.dataset.detail));}));
  document.querySelectorAll('.exercise').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('button,a,details,summary'))return;if(!started)return;const idx=Number(el.dataset.index);moveTo(idx);}));
}
function updateUI(){
  document.getElementById('sessionElapsed').textContent=fmt(sessionElapsed);
  const timerLabel=document.getElementById('currentTimerLabel');
  if(inRest){
    document.getElementById('currentElapsed').textContent=fmt(restRemaining);
    if(timerLabel)timerLabel.textContent='休息剩余';
  }else if(memberUsesCountdown()){
    document.getElementById('currentElapsed').textContent=fmt(Math.max(0,countdownRemaining));
    if(timerLabel)timerLabel.textContent='当前剩余';
  }else{
    document.getElementById('currentElapsed').textContent=fmt(itemDurations[currentIndex]||0);
    if(timerLabel)timerLabel.textContent='当前动作';
  }
  document.getElementById('progressCount').textContent=`${completed.size}/${flat.length}`;
  const pct=flat.length?Math.round(completed.size/flat.length*100):0;
  document.getElementById('progressPct').textContent=pct+'%';
  document.getElementById('progressBar').style.width=pct+'%';
  flat.forEach((x,i)=>{
    const el=document.getElementById('ex-'+i);if(!el)return;
    el.classList.toggle('current',started&&!inRest&&i===currentIndex);
    el.classList.toggle('done',completed.has(i));
    const n=el.querySelector('.step-num');n.textContent=completed.has(i)?'✓':String(i+1);
    document.getElementById('time-'+i).textContent='实际训练 '+fmt(itemDurations[i]);
  });
}
function setControls(){
  const start=document.getElementById('startBtn'),pause=document.getElementById('pauseBtn');
  const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn'),complete=document.getElementById('completeBtn');
  const skip=document.getElementById('skipRestBtn'),dock=document.querySelector('.dock-inner');

  start.querySelector('span:last-child').textContent=started?(paused?'继续锻炼':inRest?'休息中':transitioning?'准备中':'训练中'):'开始锻炼';
  start.disabled=started&&!paused;
  pause.disabled=!started||paused||inRest;

  prev.disabled=!started||transitioning||inRest||currentIndex<=0;
  next.disabled=!started||transitioning||inRest;
  next.querySelector('span:last-child').textContent=hasMoreSets()?'完成本组':'后一项';

  complete.disabled=!started||transitioning||inRest;

  skip.hidden=!inRest;
  skip.disabled=!inRest;
  dock.classList.toggle('resting',inRest);
}

function startWorkout(){
  if(started&&paused){
    paused=false;
    requestWakeLock();
    transitioning=false;
    speak('继续训练。',()=>{
      if(!started||paused)return;
      startTick();
    });
    setControls();
    return;
  }
  if(started)return;
  started=true;
  paused=false;
  currentIndex=Math.min(currentIndex,flat.length-1);
  currentSet=Math.max(1,currentSet||1);
  requestWakeLock();
  scrollCurrent();
  updateUI();
  setControls();
  announceAndStartCurrent({isFirst:true});
}

function pauseWorkout(){
  if(!started||paused)return;
  paused=true;
  transitioning=false;
  inRest=false;
  clearInterval(restTick);restTick=null;
  transitionToken++;
  clearInterval(tick);
  tick=null;
  try{if('speechSynthesis'in window)speechSynthesis.cancel()}catch(e){}
  speak('训练已暂停。');
  setControls();
}

function startTick(){
  clearInterval(tick);
  transitioning=false;
  if(memberUsesCountdown() && countdownRemaining<=0) resetCountdownForCurrent();
  tick=setInterval(()=>{
    if(!started||paused||transitioning||inRest)return;
    sessionElapsed++;
    itemDurations[currentIndex]++;
    if(memberUsesCountdown()){
      countdownRemaining=Math.max(0,countdownRemaining-1);
      if(countdownRemaining===10&&!tenSecondCue){
        tenSecondCue=true;
        speak('还有10秒。');
      }
      updateUI();
      if(countdownRemaining<=0){
        clearInterval(tick);tick=null;
        handleCountdownComplete();
      }
    }else{
      checkReminder();
      updateUI();
    }
  },1000);
  setControls();
}

function handleCountdownComplete(){
  if(!started||paused||inRest)return;
  if(hasMoreSets()){
    startGroupRest();
    return;
  }
  completed.add(currentIndex);
  updateUI();
  if(currentIndex<flat.length-1){
    moveTo(currentIndex+1);
  }else{
    finishWorkout();
  }
}

function checkReminder(){
  const sec=itemDurations[currentIndex],min=Math.floor(sec/60);
  if(sec>=120&&sec%60===0&&reminderMinute[currentIndex]!==min){
    reminderMinute[currentIndex]=min;
    speak(`当前动作已经进行${min}分钟。`);
  }
}

function announceAndStartCurrent({isFirst=false,isPrevious=false,label=""}={}){
  if(!started||paused||!flat[currentIndex])return;
  clearInterval(tick);
  tick=null;
  transitioning=true;
  const token=++transitionToken;
  const x=flat[currentIndex];
  const g=guideFor(x.title,x.desc);
  const setLead=explicitSetCount(x)>1?`现在是第${currentSet}组。`:"";
  const announcement=label?`${label}，${x.title}。${exercisePrescription(x)}。${setLead}`:`${nextAnnouncement(x,isFirst,isPrevious)}${setLead}`;

  scrollCurrent();
  updateUI();
  setControls();
  toast(`${x.title} · ${exercisePrescription(x)}`);

  speak(announcement,()=>{
    if(token!==transitionToken||!started||paused)return;
    if(memberUsesCountdown()) resetCountdownForCurrent();
    startTick();
    // Start timing first, then narrate technique while the timer is running.
    speak(`开始计时。动作要点：${g.points}。呼吸：${g.breathing}`);
  });
}

function startGroupRest(){
  if(!started||paused||inRest||!flat[currentIndex])return;
  clearInterval(tick);tick=null;
  transitioning=false;
  inRest=true;
  restTotal=groupRestSeconds(flat[currentIndex]);
  restRemaining=restTotal;
  const finishedSet=currentSet;
  const nextSet=currentSet+1;
  setControls();
  updateUI();
  speak(`第${finishedSet}组完成。组间休息${restTotal}秒。你可以点击略过休息。`);

  clearInterval(restTick);
  let tenSecondCue=false;
  restTick=setInterval(()=>{
    if(!started||paused||!inRest)return;
    sessionElapsed++;
    restRemaining=Math.max(0,restRemaining-1);
    if(restRemaining===10&&!tenSecondCue){
      tenSecondCue=true;
      speak('还有10秒，准备下一组。');
    }
    updateUI();
    if(restRemaining<=0)finishGroupRest(false);
  },1000);
}

function finishGroupRest(skipped=false){
  if(!inRest)return;
  clearInterval(restTick);restTick=null;
  inRest=false;
  currentSet++;
  const x=flat[currentIndex];
  updateUI();
  setControls();
  const prefix=skipped?'已略过休息。':'休息结束。';
  speak(`${prefix}开始第${currentSet}组。${x.title}。${exercisePrescription(x)}。`,()=>{
    if(!started||paused||inRest)return;
    if(memberUsesCountdown()) resetCountdownForCurrent();
    startTick();
    const g=guideFor(x.title,x.desc);
    speak(`第${currentSet}组开始计时。动作要点：${g.points}。呼吸：${g.breathing}`);
  });
}

function advanceWorkout(){
  if(!started||paused||transitioning||inRest)return;
  if(hasMoreSets()){
    startGroupRest();
    return;
  }
  if(currentIndex>=flat.length-1){
    toast('已经是最后一项，可以标记完成');
    return;
  }
  moveTo(currentIndex+1);
}

function moveTo(idx){
  if(!started||idx<0||idx>=flat.length||transitioning||inRest)return;
  const old=currentIndex;
  clearInterval(tick);tick=null;
  clearInterval(restTick);restTick=null;
  if(idx>old)completed.add(old);
  currentIndex=idx;
  currentSet=1;
  resetCountdownForCurrent();
  updateUI();
  setControls();
  announceAndStartCurrent({isPrevious:idx<old});
}

function scrollCurrent(){requestAnimationFrame(()=>document.getElementById('ex-'+currentIndex)?.scrollIntoView({behavior:'smooth',block:'center'}));}
function finishWorkout(){
  if(!started)return;transitionToken++;transitioning=false;inRest=false;clearInterval(restTick);restTick=null;try{if('speechSynthesis'in window)speechSynthesis.cancel()}catch(e){}if(currentIndex<flat.length-1&&!confirm(`还有 ${flat.length-1-currentIndex} 项未到达，仍然标记完成吗？`))return;completed.add(currentIndex);const record={date:new Date().toISOString(),day,member,totalSec:sessionElapsed,items:flat.map((x,i)=>({title:x.title,sec:itemDurations[i]})).filter(x=>x.sec>0)};const rs=getRecords();rs.push(record);localStorage.setItem('fitness_records_v2',JSON.stringify(rs));clearInterval(tick);tick=null;started=false;paused=false;releaseWakeLock();completed=new Set(flat.map((_,i)=>i));updateUI();setControls();renderHistory();speak(`训练完成，总时长${Math.floor(sessionElapsed/60)}分钟${sessionElapsed%60}秒。`);toast('训练已完成并保存时长');}
function endWithoutRecord(){transitionToken++;transitioning=false;inRest=false;clearInterval(restTick);restTick=null;clearInterval(tick);tick=null;try{if('speechSynthesis'in window)speechSynthesis.cancel()}catch(e){}started=false;paused=false;releaseWakeLock();}
function getRecords(){try{return JSON.parse(localStorage.getItem('fitness_records_v2')||'[]')}catch{return[]}}
function renderHistory(){const all=getRecords().filter(r=>r.member===member).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('historyTitle').textContent=`${members[member]}的完成记录 · ${all.length} 次`;const el=document.getElementById('historyList');if(!all.length){el.innerHTML='<div class="empty">暂无记录，完成一次训练后会显示总时长和每个动作的实际用时。</div>';return;}el.innerHTML=all.slice(0,8).map(r=>`<div class="record"><div class="record-top"><strong>${new Date(r.date).toLocaleDateString('zh-CN')} ${esc(r.day)}</strong><strong>${fmt(r.totalSec)}</strong></div><details><summary>查看动作时长</summary><div class="record-items">${r.items.map(x=>`${esc(x.title)}：${fmt(x.sec)}`).join('<br>')}</div></details></div>`).join('');}

function speak(text,onend=null){
  if(!('speechSynthesis'in window)){
    toast('当前设备不支持语音朗读');
    if(typeof onend==='function')setTimeout(onend,50);
    return;
  }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';
    u.rate=1.02;
    const vs=speechSynthesis.getVoices();
    const zh=vs.filter(v=>/^zh/i.test(v.lang));
    const female=/ting|mei|jia|yating|lili|xiaoxiao|xiaoyi|xiaohan|xiaomeng|xiaorui|xiaoshuang|xiaoxuan|sandy|shelley|flo|grandma|female|女/i;
    u.voice=zh.find(v=>female.test(v.name))||zh[0]||null;
    u.pitch=1.06;
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      if(typeof onend==='function')onend();
    };
    u.onend=finish;
    u.onerror=finish;
    speechSynthesis.speak(u);
  }catch(e){
    if(typeof onend==='function')setTimeout(onend,50);
  }
}
function speakGuide(i){const x=flat[i],g=guideFor(x.title,x.desc);speak(g.voice);}
function openDetail(i){activeDetailIndex=i;const x=flat[i],g=guideFor(x.title,x.desc);document.getElementById('homeView').classList.add('hide');document.getElementById('detailView').classList.add('show');document.getElementById('detailTitle').textContent=x.title;document.getElementById('detailPlan').textContent=`计划：${x.plan} · ${x.desc}`;document.getElementById('detailPoints').textContent=g.points;document.getElementById('detailErrors').textContent=g.errors;document.getElementById('detailBreathing').textContent=g.breathing;document.getElementById('detailBeginner').textContent=g.beginner;document.getElementById('imageDemo').href=`https://www.bing.com/images/search?q=${q(g.query)}`;document.getElementById('videoDemo').href=`https://www.youtube.com/results?search_query=${q(g.query)}`;window.scrollTo({top:0,behavior:'smooth'});}
function closeDetail(){document.getElementById('detailView').classList.remove('show');document.getElementById('homeView').classList.remove('hide');activeDetailIndex=null;if(started)scrollCurrent();}

async function requestWakeLock(){
  const badge=document.getElementById('wakeBadge');if(!('wakeLock'in navigator)){badge.textContent='⚠️ 常亮功能不受支持';badge.className='wake warn';return;}
  try{wakeLock=await navigator.wakeLock.request('screen');badge.textContent='☀️ 屏幕常亮中';badge.className='wake on';wakeLock.addEventListener('release',()=>{if(started){badge.textContent='↻ 正在恢复常亮';badge.className='wake warn';}});}catch(e){badge.textContent='⚠️ 无法保持常亮';badge.className='wake warn';}
}
async function releaseWakeLock(){try{if(wakeLock)await wakeLock.release()}catch(e){}wakeLock=null;const b=document.getElementById('wakeBadge');b.textContent='☀️ 开始后保持常亮';b.className='wake';}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&started)requestWakeLock();});

document.querySelectorAll('.member-btn').forEach(b=>b.addEventListener('click',()=>{if(started&&!confirm('切换家庭成员会结束当前训练，继续吗？'))return;endWithoutRecord();member=b.dataset.member;localStorage.setItem('fitness_member',member);render();}));
document.getElementById('startBtn').addEventListener('click',startWorkout);document.getElementById('pauseBtn').addEventListener('click',pauseWorkout);document.getElementById('prevBtn').addEventListener('click',()=>moveTo(currentIndex-1));document.getElementById('nextBtn').addEventListener('click',advanceWorkout);document.getElementById('skipRestBtn').addEventListener('click',()=>finishGroupRest(true));document.getElementById('completeBtn').addEventListener('click',finishWorkout);document.getElementById('backBtn').addEventListener('click',closeDetail);document.getElementById('detailSpeak').addEventListener('click',()=>{if(activeDetailIndex!=null)speakGuide(activeDetailIndex)});
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#detail-')&&document.getElementById('detailView').classList.contains('show'))closeDetail();});

render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
